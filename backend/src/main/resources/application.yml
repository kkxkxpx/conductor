spring:
  application:
    name: customer-portal-service
  reactor:
    context-propagation: AUTO

server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

user-defined:
  api:
    version: 1
    global-endpoint-base: v${user-defined.api.version}/customers

customer360:
  base-url: ${CUSTOMER360_BASE_URL:http://localhost:9100}
  api-key: ${CUSTOMER360_API_KEY:}
  api-secret: ${CUSTOMER360_API_SECRET:}
  connect-timeout-ms: 3000
  response-timeout-ms: 5000

cors:
  allowed-origin-patterns: ${PORTAL_CORS_ALLOWED_ORIGINS:http://localhost:3000}
